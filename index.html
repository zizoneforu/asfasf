const k=W*0.86/TW,ang=Math.sin(t*0.35)*0.32,ca=Math.cos(ang),sa=Math.sin(ang),bob=Math.sin(t*0.8)*2,Q=[];
for(let j=0;j<=GY;j++){Q[j]=[];for(let i=0;i<=GX;i++){const w=warp(i/GX*TW,j/GY*TH,t);
const X=(w[0]-TW/2)*ca-w[2]*sa,Z=(w[0]-TW/2)*sa+w[2]*ca,Y=w[1]-TH/2,s=420/(420+Z);
Q[j][i]=[Math.round(W/2+X*s*k),Math.round(H/2+Y*s*k+bob),X,Y,Z]}}
for(let j=0;j<GY;j++)for(let i=0;i<GX;i++){const a=Q[j][i],b=Q[j][i+1],c=Q[j+1][i],d=Q[j+1][i+1];
const u0=i/GX*TW,u1=(i+1)/GX*TW,v0=j/GY*TH,v1=(j+1)/GY*TH;
[[a,b,c,u0,v0,u1,v0,u0,v1],[b,d,c,u1,v0,u1,v1,u0,v1]].forEach(q=>{const[p,r,s]=q;
const e1=[r[2]-p[2],r[3]-p[3],r[4]-p[4]],e2=[s[2]-p[2],s[3]-p[3],s[4]-p[4]];
let n=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]];const m=Math.hypot(...n)||1;
const ndl=Math.abs((n[0]*LV[0]+n[1]*LV[1]+n[2]*LV[2])/m),lv=ndl;
tri(p,r,s,q[3],q[4],q[5],q[6],q[7],q[8],(1-(0.5+0.5*lv))*0.75,Math.pow(lv,30)*0.12)})}
if(glitch>0){glitch--;for(let s=0;s<3;s++){const y=Math.floor(Math.random()*H),h=2+Math.floor(Math.random()*6);ctx.drawImage(cv,0,y,W,h,Math.round((Math.random()-.5)*12),y,W,h)}}
else if(Math.random()<0.01)glitch=3;
const im=ctx.getImageData(0,0,W,H),D=im.data;par^=1;
for(let y=0;y<H;y++){const il=1;for(let x=0;x<W;x++){const i=(y*W+x)*4;
if(D[i+3]<128){D[i+3]=0;continue}D[i+3]=255;const o=(BY4[(y&3)*4+(x&3)]-7.5)*0.6;
for(let c=0;c<3;c++){let v=(D[i+c]+o)*il;v=Math.max(0,Math.min(255,v));D[i+c]=v&0xF8}}}
ctx.putImageData(im,0,0)}
const fl=document.getElementById('float'),items=[],rr=rnd(29);
const MED=["mark_vusglacks", "mark_millennium", "sword_a", "sword_b", "hibiscus", "ornament", "txt_vusglacks", "txt_millennium", "notice_title", "v_hongdae", "banner_live", "notice_date"],SMALL=["hz_0", "hz_1", "hz_2", "hz_3", "hz_4", "hz_5", "banner_date_00", "banner_date_01", "banner_live_00", "banner_live_02", "banner_live_03", "banner_live_04", "banner_modeci_00", "gongji_00", "notice_date_01", "notice_date_02", "notice_date_03", "notice_date_04", "notice_date_05", "v_date_01", "v_date_02", "v_date_03", "v_date_04", "v_date_05", "v_fee_00", "v_fee_01", "v_modeci_00", "vz_0", "vz_1", "vz_2", "vz_3", "vz_4", "vz_5"],list=[];
MED.forEach(k=>list.push([k,1]));SMALL.forEach(k=>{list.push([k,0.7+rr()*0.5]);list.push([k,0.5+rr()*0.4])});
for(let i=list.length-1;i>0;i--){const j=Math.floor(rr()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
list.forEach(([k,sc],n)=>{const el=new Image();el.src=A[k][0];el.className='it';el.alt='';
el.style.width='min('+Math.round(A[k][1]*sc)+'px,'+(k=='banner_live'?'80vw':'44vw')+')';fl.appendChild(el);
items.push({el,x:rr()*0.92,base:n/list.length,sp:0.6+rr()*0.8,fl:rr()})});
document.querySelectorAll('[data-g]').forEach(el=>{const v=el.dataset.g.split('|');setInterval(()=>{if(Math.random()<.25){el.textContent=v[1];setTimeout(()=>el.textContent=v[0],180)}},900)});

const mqs=[...document.querySelectorAll('.mq')].map(el=>({el,s:el.querySelector('span'),dir:+el.dataset.dir,x:0,hov:false}));
mqs.forEach(m=>{m.x=m.dir<0?m.el.clientWidth:-m.s.offsetWidth;m.el.onmouseenter=()=>m.hov=true;m.el.onmouseleave=()=>m.hov=false});
setInterval(()=>mqs.forEach(m=>{if(m.hov)return;const W=m.el.clientWidth,S=m.s.offsetWidth;m.x+=m.dir*5;
if(m.dir<0&&m.x<-S)m.x=W;if(m.dir>0&&m.x>W)m.x=-S;m.s.style.transform='translateX('+m.x+'px)'}),70);

const bc=document.getElementById('bolt'),bx=bc.getContext('2d');
function strike(){bc.width=Math.max(1,Math.round((innerWidth||300)/3));bc.height=Math.max(1,Math.round((innerHeight||600)/3));const W=bc.width,H=bc.height;
bx.clearRect(0,0,W,H);bx.strokeStyle='#fff';bx.lineWidth=1;let x=W*(0.2+Math.random()*0.6),y=0;bx.beginPath();bx.moveTo(x,y);
const br=[];while(y<H*0.85){x+=(Math.random()-.5)*W*0.08;y+=H*(0.03+Math.random()*0.05);bx.lineTo(Math.round(x),Math.round(y));if(Math.random()<.18)br.push([x,y])}
bx.stroke();br.forEach(([sx,sy])=>{bx.beginPath();bx.moveTo(sx,sy);let X=sx,Y=sy;for(let k=0;k<5;k++){X+=(Math.random()-.5)*W*0.07;Y+=H*0.03;bx.lineTo(Math.round(X),Math.round(Y))}bx.stroke()});
const B=document.body.classList;B.add('strike');setTimeout(()=>B.remove('strike'),70);setTimeout(()=>B.add('strike'),130);setTimeout(()=>B.remove('strike'),175);setTimeout(()=>bx.clearRect(0,0,W,H),260)}
setTimeout(()=>{strike();setInterval(strike,13000)},6000);
let lf=0,li=0;
function loop(ms){const t=ms/1000;
if(ms-lf>90){drawFog(t);drawFlag(t);lf=ms}
if(ms-li>110){li=ms;const r=fl.getBoundingClientRect(),H=fl.offsetHeight,Wd=fl.offsetWidth,prog=-r.top/H;
items.forEach(it=>{let y=(it.base-prog*it.sp*0.5-t*0.003*it.sp)%1;if(y<0)y+=1;y=y*1.15-0.08;
const px=Math.round(it.x*Wd*0.85/3)*3,py=Math.round(y*H/3)*3;it.el.style.transform='translate('+px+'px,'+py+'px)';
it.el.style.opacity=Math.random()<0.025?0:1})}
requestAnimationFrame(loop)}
requestAnimationFrame(loop);
